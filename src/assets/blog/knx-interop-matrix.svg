<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="IBM Plex Sans, Segoe UI, sans-serif" role="img" aria-label="go-knx is tested over KNXnet/IP against the independent KNX stacks of knx-interop v0.5.0: Calimero server and tools, knxd, xknx and KNXUltimate, plus a raw probe. Tunnelling, routing, datapoint types, TCP, device management, busmonitor and KNX Secure run both ways. 423 results pass and none fail.">
  <rect width="720" height="400" fill="#F4F6F8"/>
  <text x="40" y="44" font-size="15" font-weight="600" fill="#17212B">go-knx against independent KNX stacks</text>
  <text x="680" y="44" font-size="12" fill="#5A6875" text-anchor="end" font-family="IBM Plex Mono, monospace">knx-interop v0.5.0</text>
  <g font-size="11" fill="#5A6875" font-family="IBM Plex Mono, monospace"><text x="40" y="80">REFERENCE STACKS</text><text x="680" y="80" text-anchor="end">TESTED BOTH WAYS</text></g>
  <g fill="none" stroke="#0A7C80" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
    <path d="M240 116 C 275 116, 265 178, 300 178"/>
    <path d="M240 166 C 275 166, 265 178, 300 178"/>
    <path d="M240 216 C 275 216, 265 178, 300 178"/>
    <path d="M240 266 C 275 266, 265 178, 300 178"/>
    <path d="M420 178 C 455 178, 445 116, 480 116"/>
    <path d="M420 178 C 455 178, 445 166, 480 166"/>
    <path d="M420 178 C 455 178, 445 216, 480 216"/>
    <path d="M420 178 C 455 178, 445 266, 480 266"/>
  </g>
  <g><rect x="40" y="96" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="52" y="112" font-size="12.5" font-weight="600" fill="#17212B">Calimero 3.0-M1</text>
    <text x="228" y="112" font-size="11" fill="#5A6875" text-anchor="end">Java</text>
    <text x="52" y="127" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">server · tools · Secure</text></g>
  <g><rect x="40" y="146" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="52" y="162" font-size="12.5" font-weight="600" fill="#17212B">knxd 0.14.73</text>
    <text x="228" y="162" font-size="11" fill="#5A6875" text-anchor="end">C++</text>
    <text x="52" y="177" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">server · client · router</text></g>
  <g><rect x="40" y="196" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="52" y="212" font-size="12.5" font-weight="600" fill="#17212B">xknx 4.0.0</text>
    <text x="228" y="212" font-size="11" fill="#5A6875" text-anchor="end">Python</text>
    <text x="52" y="227" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">client · router · Secure</text></g>
  <g><rect x="40" y="246" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="52" y="262" font-size="12.5" font-weight="600" fill="#17212B">KNXUltimate 6.3.1</text>
    <text x="228" y="262" font-size="11" fill="#5A6875" text-anchor="end">TypeScript</text>
    <text x="52" y="277" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">client · router</text></g>
  <g><rect x="480" y="96" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="492" y="112" font-size="12.5" font-weight="600" fill="#17212B">Discovery, tunnelling</text>
    <text x="492" y="127" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">UDP · TCP · NAT</text></g>
  <g><rect x="480" y="146" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="492" y="162" font-size="12.5" font-weight="600" fill="#17212B">Routing, group values</text>
    <text x="492" y="177" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">multicast · 12 DPT vectors</text></g>
  <g><rect x="480" y="196" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="492" y="212" font-size="12.5" font-weight="600" fill="#17212B">Management, busmonitor</text>
    <text x="492" y="227" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">properties · raw frames</text></g>
  <g><rect x="480" y="246" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="492" y="262" font-size="12.5" font-weight="600" fill="#17212B">KNX IP Secure, Data Secure</text>
    <text x="492" y="277" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">sessions · routing · keyrings</text></g>
  <g><rect x="300" y="130" width="120" height="96" rx="10" fill="#0A7C80"/>
    <text x="360" y="160" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">go-knx</text>
    <text x="360" y="180" font-size="10.5" fill="#DCEFEF" text-anchor="middle" font-family="IBM Plex Mono, monospace">KNXnet/IP</text>
    <text x="360" y="194" font-size="10.5" fill="#DCEFEF" text-anchor="middle" font-family="IBM Plex Mono, monospace">client · server</text>
    <text x="360" y="215" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">423 pass · 0 fail</text></g>
  <g><rect x="40" y="306" width="640" height="40" rx="6" fill="#E3EAF5" stroke="#C6D3E8"/>
    <text x="56" y="331" font-size="12.5" font-weight="600" fill="#17212B">One Docker network, multicast 224.0.23.12:3671</text>
    <text x="664" y="331" font-size="10.5" fill="#2F5D9E" text-anchor="end" font-family="IBM Plex Mono, monospace">raw probe · 23 of 23 negative checks</text></g>
  <text x="40" y="380" font-size="11" fill="#5A6875">Interoperability, not KNX certification. KNX Secure from public sources; no physical KNX interface tested yet.</text>
</svg>
