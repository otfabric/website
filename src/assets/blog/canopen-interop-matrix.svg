<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="IBM Plex Sans, Segoe UI, sans-serif" role="img" aria-label="go-canopen runs on go-canbus, the CAN transport, and is tested on Linux virtual CAN against the independent CANopen stacks of canopen-interop v0.2.0: CANopenNode, Lely CANopen and python canopen, each as device and as master. SDO, NMT, PDO, SYNC, EMCY, LSS and the CiA 302 boot-up run both ways. 1,276 scenarios pass and none fail.">
  <rect width="720" height="400" fill="#F4F6F8"/>
  <text x="40" y="44" font-size="15" font-weight="600" fill="#17212B">go-canopen against independent CANopen stacks</text>
  <text x="680" y="44" font-size="12" fill="#5A6875" text-anchor="end" font-family="IBM Plex Mono, monospace">canopen-interop v0.2.0</text>
  <g font-size="11" fill="#5A6875" font-family="IBM Plex Mono, monospace"><text x="40" y="80">REFERENCE STACKS</text><text x="680" y="80" text-anchor="end">TESTED BOTH WAYS</text></g>
  <g fill="none" stroke="#0A7C80" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
    <path d="M240 116 C 275 116, 265 158, 300 158"/>
    <path d="M240 166 C 275 166, 265 158, 300 158"/>
    <path d="M240 216 C 275 216, 265 158, 300 158"/>
    <path d="M420 158 C 455 158, 445 116, 480 116"/>
    <path d="M420 158 C 455 158, 445 166, 480 166"/>
    <path d="M420 158 C 455 158, 445 216, 480 216"/>
  </g>
  <g fill="none" stroke="#2F5D9E" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
    <path d="M360 206 V 228"/>
    <path d="M360 268 V 300"/>
  </g>
  <g><rect x="40" y="96" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="52" y="112" font-size="12.5" font-weight="600" fill="#17212B">CANopenNode</text>
    <text x="228" y="112" font-size="11" fill="#5A6875" text-anchor="end">C</text>
    <text x="52" y="127" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">device · master · LSS</text></g>
  <g><rect x="40" y="146" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="52" y="162" font-size="12.5" font-weight="600" fill="#17212B">Lely CANopen</text>
    <text x="228" y="162" font-size="11" fill="#5A6875" text-anchor="end">C/C++</text>
    <text x="52" y="177" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">LSS · MPDO · CiA 302 boot</text></g>
  <g><rect x="40" y="196" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="52" y="212" font-size="12.5" font-weight="600" fill="#17212B">python canopen</text>
    <text x="228" y="212" font-size="11" fill="#5A6875" text-anchor="end">Python</text>
    <text x="52" y="227" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">PDO · CiA 402 · EDS</text></g>
  <g><rect x="480" y="96" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="492" y="112" font-size="12.5" font-weight="600" fill="#17212B">SDO, NMT, heartbeat</text>
    <text x="492" y="127" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">block transfer · aborts</text></g>
  <g><rect x="480" y="146" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="492" y="162" font-size="12.5" font-weight="600" fill="#17212B">PDO, SYNC, EMCY</text>
    <text x="492" y="177" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">MPDO · SYNC window</text></g>
  <g><rect x="480" y="196" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="492" y="212" font-size="12.5" font-weight="600" fill="#17212B">LSS, CiA 302 boot-up</text>
    <text x="492" y="227" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">Fastscan · concise DCF</text></g>
  <g><rect x="300" y="110" width="120" height="96" rx="10" fill="#0A7C80"/>
    <text x="360" y="140" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">go-canopen</text>
    <text x="360" y="160" font-size="10.5" fill="#DCEFEF" text-anchor="middle" font-family="IBM Plex Mono, monospace">CiA 301 · 302</text>
    <text x="360" y="174" font-size="10.5" fill="#DCEFEF" text-anchor="middle" font-family="IBM Plex Mono, monospace">305 · 306 · 402</text>
    <text x="360" y="195" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">1,276 pass · 0 fail</text></g>
  <g><rect x="300" y="228" width="120" height="40" rx="8" fill="#2F5D9E"/>
    <text x="360" y="245" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">go-canbus</text>
    <text x="360" y="260" font-size="10.5" fill="#E3EAF5" text-anchor="middle" font-family="IBM Plex Mono, monospace">CAN transport</text></g>
  <g><rect x="40" y="300" width="640" height="40" rx="6" fill="#E3EAF5" stroke="#C6D3E8"/>
    <text x="56" y="325" font-size="12.5" font-weight="600" fill="#17212B">Linux virtual CAN (vcan), amd64 and arm64</text>
    <text x="664" y="325" font-size="10.5" fill="#2F5D9E" text-anchor="end" font-family="IBM Plex Mono, monospace">57 known differences · 287 skipped · 0 failed</text></g>
  <text x="40" y="380" font-size="11" fill="#5A6875">Interoperability, not CiA conformance. CANopen FD is not interop tested: no open reference implements it yet.</text>
</svg>
