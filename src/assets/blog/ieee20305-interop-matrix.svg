    <text x="500" y="135" font-size="12.5" font-weight="600" fill="#17212B">Envoy (ANU)</text>
    <text x="668" y="135" font-size="11" fill="#5A6875" text-anchor="end">Python</text>
    <text x="500" y="149" font-size="10.5" fill="#B35A1F" font-family="IBM Plex Mono, monospace">2018 · CSIP-AUS</text></g>
