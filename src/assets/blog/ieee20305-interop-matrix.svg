    <text x="220" y="119" font-size="11" fill="#5A6875" text-anchor="end">Go</text>
    <text x="52" y="133" font-size="10.5" fill="#B35A1F" font-family="IBM Plex Mono, monospace">2018 · 2023 · CSIP</text></g>
  <g><rect x="40" y="146" width="192" height="36" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="52" y="161" font-size="12.5" font-weight="600" fill="#17212B">py20305</text>
    <text x="220" y="161" font-size="11" fill="#5A6875" text-anchor="end">Python</text>
    <text x="52" y="175" font-size="10.5" fill="#B35A1F" font-family="IBM Plex Mono, monospace">2018 · 2023 · CSIP-AUS</text></g>
  <g><rect x="40" y="188" width="192" height="36" rx="6" fill="#FFFFFF" stroke="#D9DFE4" stroke-dasharray="4 3"/>
