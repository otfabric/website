<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="IBM Plex Sans, Segoe UI, sans-serif" role="img" aria-label="go-ieee20305 tested in both roles against four independent IEEE 2030.5 implementations: the GridAPPS-D, py20305 and EPRI clients against the go-ieee20305 server, and the go-ieee20305 client and device agent against the Envoy and GridAPPS-D servers, over mutual TLS with CCM_8.">
  <rect width="720" height="300" fill="#F4F6F8"/>
  <text x="40" y="44" font-size="15" font-weight="600" fill="#17212B">go-ieee20305 against four independent IEEE 2030.5 stacks</text>
  <text x="680" y="44" font-size="12" fill="#5A6875" text-anchor="end" font-family="IBM Plex Mono, monospace">ieee20305-interop v0.2.0</text>
  <g font-size="11" fill="#5A6875" font-family="IBM Plex Mono, monospace"><text x="40" y="74">REFERENCE CLIENTS</text><text x="680" y="74" text-anchor="end">REFERENCE SERVERS</text></g>
  <g fill="none" stroke="#B35A1F" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
    <path d="M232 122 C 280 122, 270 159, 296 159"/>
    <path d="M232 164 C 280 164, 270 159, 296 159"/>
    <path d="M232 206 C 280 206, 270 159, 296 159" stroke-dasharray="4 4"/>
    <path d="M424 159 C 455 159, 440 138, 488 138"/>
