  <text x="360" y="170" font-size="10.5" fill="#5A6875" text-anchor="middle" font-family="IBM Plex Mono, monospace">both roles</text>
  <text x="360" y="185" font-size="10.5" fill="#5A6875" text-anchor="middle" font-family="IBM Plex Mono, monospace">v0.5.2</text>
  <text x="40" y="282" font-size="12" fill="#17212B"><tspan font-weight="600">Both roles, four independent stacks.</tspan><tspan fill="#5A6875"> Mutual TLS and CCM_8, both editions, CSIP and CSIP-AUS.</tspan></text>
