<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="IBM Plex Sans, Segoe UI, sans-serif" role="img" aria-label="go-ethernetip tested in both roles against four independent EtherNet/IP implementations: the originators EIPScanner, pycomm3 and cpppo against go-ethernetip as the target and Logix emulation, and go-ethernetip as the originator against the OpENer and cpppo targets.">
  <rect width="720" height="300" fill="#F4F6F8"/>
  <text x="40" y="44" font-size="15" font-weight="600" fill="#17212B">go-ethernetip against four independent EtherNet/IP stacks</text>
  <text x="680" y="44" font-size="12" fill="#5A6875" text-anchor="end" font-family="IBM Plex Mono, monospace">ethernetip-interop v0.2.0</text>
  <g font-size="11" fill="#5A6875" font-family="IBM Plex Mono, monospace"><text x="40" y="74">REFERENCE ORIGINATORS</text><text x="680" y="74" text-anchor="end">REFERENCE TARGETS</text></g>
  <g fill="none" stroke="#0A7C80" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
    <path d="M232 104 C 280 104, 270 159, 306 159"/>
    <path d="M232 146 C 280 146, 270 159, 306 159"/>
    <path d="M232 188 C 280 188, 270 159, 306 159"/>
    <path d="M414 159 C 450 159, 440 125, 488 125"/>
    <path d="M414 159 C 450 159, 440 167, 488 167"/>
  </g>
  <g><rect x="40" y="86" width="192" height="36" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="52" y="101" font-size="12.5" font-weight="600" fill="#17212B">EIPScanner</text>
    <text x="220" y="101" font-size="11" fill="#5A6875" text-anchor="end">C++</text>
    <text x="52" y="115" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">Class 1 I/O · explicit</text></g>
  <g><rect x="40" y="128" width="192" height="36" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="52" y="143" font-size="12.5" font-weight="600" fill="#17212B">pycomm3</text>
    <text x="220" y="143" font-size="11" fill="#5A6875" text-anchor="end">Python</text>
    <text x="52" y="157" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">Logix · Class 3 · routing</text></g>
  <g><rect x="40" y="170" width="192" height="36" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="52" y="185" font-size="12.5" font-weight="600" fill="#17212B">cpppo</text>
    <text x="220" y="185" font-size="11" fill="#5A6875" text-anchor="end">Python</text>
    <text x="52" y="199" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">Logix · explicit</text></g>
  <g><rect x="488" y="107" width="192" height="36" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="500" y="122" font-size="12.5" font-weight="600" fill="#17212B">OpENer</text>
    <text x="668" y="122" font-size="11" fill="#5A6875" text-anchor="end">C</text>
    <text x="500" y="136" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">Class 1 I/O · multicast</text></g>
  <g><rect x="488" y="149" width="192" height="36" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="500" y="164" font-size="12.5" font-weight="600" fill="#17212B">cpppo</text>
    <text x="668" y="164" font-size="11" fill="#5A6875" text-anchor="end">Python</text>
    <text x="500" y="178" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">Logix simulator</text></g>
  <rect x="306" y="122" width="108" height="74" rx="10" fill="#DCEFEF" stroke="#0A7C80" stroke-width="1.5"/>
  <text x="360" y="152" font-size="14" font-weight="600" fill="#17212B" text-anchor="middle">go-ethernetip</text>
  <text x="360" y="170" font-size="10.5" fill="#5A6875" text-anchor="middle" font-family="IBM Plex Mono, monospace">both roles</text>
  <text x="360" y="185" font-size="10.5" fill="#5A6875" text-anchor="middle" font-family="IBM Plex Mono, monospace">v0.2.1</text>
  <text x="40" y="282" font-size="12" fill="#17212B"><tspan font-weight="600">63 cases pass, none fail.</tspan><tspan fill="#5A6875"> Explicit messaging, Class 3, Class 1 I/O, multicast and Logix tags.</tspan></text>
</svg>
