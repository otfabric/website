    <text x="492" y="252" font-size="10.5" fill="#0A7C80" font-family="IBM Plex Mono, monospace">SNMP manager · 29 pass</text></g>
  <g><rect x="300" y="134" width="120" height="104" rx="10" fill="#0A7C80"/>
    <text x="360" y="166" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">go-profinet</text>
    <text x="360" y="188" font-size="10.5" fill="#DCEFEF" text-anchor="middle" font-family="IBM Plex Mono, monospace">controller</text>
    <text x="360" y="202" font-size="10.5" fill="#DCEFEF" text-anchor="middle" font-family="IBM Plex Mono, monospace">device · MRP</text>
    <text x="360" y="224" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">248 pass · 0 fail</text></g>
  <g><rect x="40" y="310" width="640" height="40" rx="6" fill="#DCEFEF" stroke="#B9DEDF"/>
    <text x="56" y="335" font-size="12.5" font-weight="600" fill="#17212B">Wireshark tshark 4.0.17 and scapy 2.6.1 decode every capture</text>
    <text x="664" y="335" font-size="10.5" fill="#0A7C80" text-anchor="end" font-family="IBM Plex Mono, monospace">decoders · 47 pass</text></g>
  <text x="40" y="380" font-size="11" fill="#5A6875">Interoperability, not PI certification. Real Layer 2 on Docker bridges; microchip-ung/mrp in micro-VMs with kernel MRP.</text>
</svg>
