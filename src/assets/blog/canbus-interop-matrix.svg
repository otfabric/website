    <path d="M420 186 C 455 186, 445 266, 480 266"/>
    <path d="M360 238 V 310"/>
  </g>
  <g><rect x="40" y="96" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="52" y="112" font-size="12.5" font-weight="600" fill="#17212B">can-utils</text>
    <text x="228" y="112" font-size="11" fill="#5A6875" text-anchor="end">C</text>
    <text x="52" y="127" font-size="10.5" fill="#2F5D9E" font-family="IBM Plex Mono, monospace">raw CAN · CAN XL · candump</text></g>
  <g><rect x="40" y="146" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="52" y="162" font-size="12.5" font-weight="600" fill="#17212B">python-can</text>
    <text x="228" y="162" font-size="11" fill="#5A6875" text-anchor="end">Python</text>
    <text x="52" y="177" font-size="10.5" fill="#2F5D9E" font-family="IBM Plex Mono, monospace">raw CAN · slcan · logs</text></g>
  <g><rect x="40" y="196" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="52" y="212" font-size="12.5" font-weight="600" fill="#17212B">socketcan-rs</text>
    <text x="228" y="212" font-size="11" fill="#5A6875" text-anchor="end">Rust</text>
    <text x="52" y="227" font-size="10.5" fill="#2F5D9E" font-family="IBM Plex Mono, monospace">raw CAN · CAN FD</text></g>
  <g><rect x="40" y="246" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="52" y="262" font-size="12.5" font-weight="600" fill="#17212B">Scapy</text>
    <text x="228" y="262" font-size="11" fill="#5A6875" text-anchor="end">Python</text>
    <text x="52" y="277" font-size="10.5" fill="#2F5D9E" font-family="IBM Plex Mono, monospace">raw CAN · CAN FD</text></g>
  <g><rect x="480" y="96" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="492" y="112" font-size="12.5" font-weight="600" fill="#17212B">Linux kernel ISO-TP</text>
    <text x="668" y="112" font-size="11" fill="#5A6875" text-anchor="end">C</text>
    <text x="492" y="127" font-size="10.5" fill="#2F5D9E" font-family="IBM Plex Mono, monospace">ISO-TP via isotpsend/recv</text></g>
  <g><rect x="480" y="146" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="492" y="162" font-size="12.5" font-weight="600" fill="#17212B">python-can-isotp</text>
    <text x="668" y="162" font-size="11" fill="#5A6875" text-anchor="end">Python</text>
    <text x="492" y="177" font-size="10.5" fill="#2F5D9E" font-family="IBM Plex Mono, monospace">ISO-TP, userspace</text></g>
