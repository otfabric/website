    <text x="668" y="262" font-size="11" fill="#5A6875" text-anchor="end">Python</text>
    <text x="492" y="277" font-size="10.5" fill="#2F5D9E" font-family="IBM Plex Mono, monospace">DBC · KCD · ARXML codec</text></g>
  <g><rect x="300" y="134" width="120" height="104" rx="10" fill="#2F5D9E"/>
    <text x="360" y="166" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">go-canbus</text>
    <text x="360" y="188" font-size="10.5" fill="#E3EAF5" text-anchor="middle" font-family="IBM Plex Mono, monospace">CAN · FD · XL</text>
    <text x="360" y="202" font-size="10.5" fill="#E3EAF5" text-anchor="middle" font-family="IBM Plex Mono, monospace">ISO-TP · DBC</text>
    <text x="360" y="224" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">170 pass · 0 fail</text></g>
  <g><rect x="40" y="310" width="640" height="40" rx="6" fill="#E3EAF5" stroke="#C6D3E8"/>
    <text x="56" y="335" font-size="12.5" font-weight="600" fill="#17212B">Linux virtual CAN (vcan), kernels 6.1 to 7.0, amd64 and arm64</text>
    <text x="664" y="335" font-size="10.5" fill="#2F5D9E" text-anchor="end" font-family="IBM Plex Mono, monospace">13 skipped · 0 failed</text></g>
  <text x="40" y="380" font-size="11" fill="#5A6875">Interoperability, not ISO or CiA conformance. Virtual CAN: no bit timing, arbitration or bus-off; not yet on real hardware.</text>
</svg>
