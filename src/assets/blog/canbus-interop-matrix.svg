<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="IBM Plex Sans, Segoe UI, sans-serif" role="img" aria-label="go-canbus tested on Linux virtual CAN against independent implementations from canbus-interop v0.5.0: the raw CAN stacks can-utils, python-can, socketcan-rs and Scapy on the left, the Linux kernel ISO-TP, python-can-isotp, cantools and canmatrix on the right. 170 scenarios pass and none fail.">
  <rect width="720" height="400" fill="#F4F6F8"/>
  <text x="40" y="44" font-size="15" font-weight="600" fill="#17212B">go-canbus against independent CAN implementations</text>
  <text x="680" y="44" font-size="12" fill="#5A6875" text-anchor="end" font-family="IBM Plex Mono, monospace">canbus-interop v0.5.0</text>
  <g font-size="11" fill="#5A6875" font-family="IBM Plex Mono, monospace"><text x="40" y="80">FRAMES AND TRACES</text><text x="680" y="80" text-anchor="end">ISO-TP AND DATABASES</text></g>
  <g fill="none" stroke="#2F5D9E" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
    <path d="M240 116 C 275 116, 265 186, 300 186"/>
