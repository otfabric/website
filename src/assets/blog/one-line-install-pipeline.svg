<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" font-family="IBM Plex Sans, Segoe UI, sans-serif" role="img" aria-label="A CI pipeline for OT tooling: one line installs a command-line tool from get.otfabric.io, a simulated station starts, the client tests it with JSON output, stable exit codes decide pass or fail, and version --json records which release and protocol stack ran. The same conventions apply to RTUs, PLCs, inverters, chargers, IEDs and drives.">
<rect width="720" height="336" fill="#F4F6F8"/>
<text x="40" y="42" font-size="15" font-weight="600" fill="#17212B">One line in, a green pipeline out</text>
<text x="680" y="42" font-size="12" fill="#5A6875" text-anchor="end" font-family="IBM Plex Mono, monospace">get.otfabric.io</text>
<rect x="40" y="58" width="640" height="62" rx="6" fill="#17212B"/>
<circle cx="56" cy="70" r="3.5" fill="#E08A4E"/>
<circle cx="68" cy="70" r="3.5" fill="#3FC1C6"/>
<circle cx="80" cy="70" r="3.5" fill="#8AB0E8"/>
<g font-family="IBM Plex Mono, monospace" font-size="12">
<text x="56" y="92" fill="#E6EAEE"><tspan fill="#3FC1C6">$</tspan> curl -fsSL https://get.otfabric.io/<tspan fill="#E08A4E">iec104ctl</tspan> | env OTF_VERSION=0.7.1 sh</text>
<text x="56" y="110" fill="#E6EAEE"><tspan fill="#3FC1C6">$</tspan> iec104ctl client interrogate --ip 127.0.0.1 --ca 1 <tspan fill="#8AB0E8">--format json</tspan> | jq .points</text>
</g>
<rect x="40" y="148" width="112" height="58" rx="5" fill="#FFFFFF" stroke="#D9DFE4"/>
<rect x="40" y="148" width="4" height="58" rx="2" fill="#2F5D9E"/>
<text x="54" y="170" font-size="10" fill="#5A6875" font-family="IBM Plex Mono, monospace">STAGE 1</text>
<text x="54" y="187" font-size="13" font-weight="600" fill="#17212B">install</text>
<text x="54" y="200" font-size="9.5" fill="#2F5D9E" font-family="IBM Plex Mono, monospace">sha256 checked</text>
<circle cx="138" cy="162" r="7" fill="#E3EAF5"/><path d="M134.5 162l2.5 2.5l4.5-5" stroke="#2F5D9E" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
