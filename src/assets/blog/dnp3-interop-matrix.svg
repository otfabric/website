<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="IBM Plex Sans, Segoe UI, sans-serif" role="img" aria-label="go-dnp3 tested in both roles against three independent DNP3 implementations: the masters of opendnp3, DSC go-dnp3 and dnp3py poll go-dnp3 as the outstation, and go-dnp3 as the master polls their outstations, over TCP, TLS, UDP and serial.">
  <rect width="720" height="300" fill="#F4F6F8"/>
  <text x="40" y="44" font-size="15" font-weight="600" fill="#17212B">go-dnp3 against three independent DNP3 stacks</text>
  <text x="680" y="44" font-size="12" fill="#5A6875" text-anchor="end" font-family="IBM Plex Mono, monospace">dnp3-interop v0.4.1</text>
  <g font-size="11" fill="#5A6875" font-family="IBM Plex Mono, monospace"><text x="40" y="74">REFERENCE MASTERS</text><text x="680" y="74" text-anchor="end">REFERENCE OUTSTATIONS</text></g>
  <g fill="none" stroke="#B35A1F" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
    <path d="M232 117 C 280 117, 270 159, 306 159"/>
    <path d="M414 159 C 450 159, 440 117, 488 117"/>
    <path d="M232 159 C 280 159, 270 159, 306 159"/>
    <path d="M414 159 C 450 159, 440 159, 488 159"/>
    <path d="M232 201 C 280 201, 270 159, 306 159"/>
    <path d="M414 159 C 450 159, 440 201, 488 201" stroke-dasharray="4 4"/>
  </g>
  <g><rect x="40" y="99" width="192" height="36" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="52" y="114" font-size="12.5" font-weight="600" fill="#17212B">opendnp3</text>
    <text x="220" y="114" font-size="11" fill="#5A6875" text-anchor="end">C++</text>
    <text x="52" y="128" font-size="10.5" fill="#B35A1F" font-family="IBM Plex Mono, monospace">TCP · TLS · UDP · serial</text></g>
  <g><rect x="488" y="99" width="192" height="36" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="500" y="114" font-size="12.5" font-weight="600" fill="#17212B">opendnp3</text>
    <text x="668" y="114" font-size="11" fill="#5A6875" text-anchor="end">C++</text>
    <text x="500" y="128" font-size="10.5" fill="#B35A1F" font-family="IBM Plex Mono, monospace">TCP · TLS · UDP · serial</text></g>
  <g><rect x="40" y="141" width="192" height="36" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="52" y="156" font-size="12.5" font-weight="600" fill="#17212B">DSC go-dnp3</text>
    <text x="220" y="156" font-size="11" fill="#5A6875" text-anchor="end">Go</text>
    <text x="52" y="170" font-size="10.5" fill="#B35A1F" font-family="IBM Plex Mono, monospace">+ files · SAv5</text></g>
  <g><rect x="488" y="141" width="192" height="36" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="500" y="156" font-size="12.5" font-weight="600" fill="#17212B">DSC go-dnp3</text>
    <text x="668" y="156" font-size="11" fill="#5A6875" text-anchor="end">Go</text>
    <text x="500" y="170" font-size="10.5" fill="#B35A1F" font-family="IBM Plex Mono, monospace">+ files · SAv5</text></g>
  <g><rect x="40" y="183" width="192" height="36" rx="6" fill="#FFFFFF" stroke="#D9DFE4"/>
    <text x="52" y="198" font-size="12.5" font-weight="600" fill="#17212B">dnp3py</text>
    <text x="220" y="198" font-size="11" fill="#5A6875" text-anchor="end">Python</text>
    <text x="52" y="212" font-size="10.5" fill="#B35A1F" font-family="IBM Plex Mono, monospace">TCP</text></g>
  <g><rect x="488" y="183" width="192" height="36" rx="6" fill="#FFFFFF" stroke="#D9DFE4" stroke-dasharray="4 3"/>
    <text x="500" y="198" font-size="12.5" font-weight="600" fill="#17212B">dnp3py</text>
    <text x="668" y="198" font-size="11" fill="#5A6875" text-anchor="end">Python</text>
    <text x="500" y="212" font-size="10.5" fill="#B35A1F" font-family="IBM Plex Mono, monospace">own fixture only</text></g>
  <rect x="306" y="122" width="108" height="74" rx="10" fill="#F6E6DA" stroke="#B35A1F" stroke-width="1.5"/>
  <text x="360" y="152" font-size="15" font-weight="600" fill="#17212B" text-anchor="middle">go-dnp3</text>
  <text x="360" y="170" font-size="10.5" fill="#5A6875" text-anchor="middle" font-family="IBM Plex Mono, monospace">both roles</text>
  <text x="360" y="185" font-size="10.5" fill="#5A6875" text-anchor="middle" font-family="IBM Plex Mono, monospace">v1.3.1</text>
  <text x="40" y="282" font-size="12" fill="#17212B"><tspan font-weight="600">Both roles, three independent stacks.</tspan><tspan fill="#5A6875"> Controls, events, time, files and Secure Authentication.</tspan></text>
