<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A thousand chargers lose their management server at the same moment and it comes back after a restart. It can accept about 200 connections a second. Top: with a fixed five-second retry, all clients come back in synchronized waves of 1000, 800, 600 and so on, far above capacity, and everyone fails repeatedly. Bottom: with exponential backoff and random jitter the same thousand attempts spread out under the capacity line and are accepted."><rect width="720" height="340" fill="#F4F6F8"/><text x="28" y="32" font-size="15" font-weight="600" fill="#17212B" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">A thousand devices reconnect after a server restart</text>
<text x="28" y="58" font-size="12" font-weight="600" fill="#17212B" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Fixed retry every 5 s: synchronized waves</text>
