<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Two failures that look identical to the client. Left: the request is lost on the way, the device does nothing and the client times out. Right: the request arrives, the device executes it, and the response is lost; the client also times out. The client sees the same timeout while the world is in two different states, so only idempotent or correlated operations may be retried blindly."><rect width="720" height="320" fill="#F4F6F8"/><text x="28" y="32" font-size="15" font-weight="600" fill="#17212B" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">A timeout does not tell you whether the command ran</text>
<rect x="28" y="50" width="314" height="232" rx="8" fill="#FFFFFF" stroke="#D9DFE4" stroke-width="1"/>
<text x="44" y="74" font-size="13" font-weight="600" fill="#17212B" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Request lost</text>
<rect x="56.0" y="88" width="84" height="24" rx="4" fill="#17212B"/>
<text x="98" y="104" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Client</text>
<line x1="98" y1="116" x2="98" y2="250" stroke="#D9DFE4" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="2 3"/>
<rect x="226.0" y="88" width="84" height="24" rx="4" fill="#17212B"/>
<text x="268" y="104" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Device</text>
<line x1="268" y1="116" x2="268" y2="250" stroke="#D9DFE4" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="2 3"/>
<line x1="98" y1="140" x2="201.0" y2="145.6" stroke="#B83A26" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="204" y1="142" x2="212" y2="150" stroke="#B83A26" stroke-width="2" stroke-linecap="butt"/>
<line x1="204" y1="150" x2="212" y2="142" stroke="#B83A26" stroke-width="2" stroke-linecap="butt"/>
<text x="153.0" y="138.0" font-size="10.5" font-weight="400" fill="#B83A26" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">write 50 kW</text>
<text x="276" y="190" font-size="10.5" font-weight="400" fill="#5A6875" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">nothing</text>
<text x="276" y="203" font-size="10.5" font-weight="400" fill="#5A6875" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">happened</text>
<rect x="64" y="214" width="68" height="22" rx="4" fill="#F6DDD8" stroke="#B83A26" stroke-width="1"/>
<text x="98" y="229" font-size="11" font-weight="600" fill="#B83A26" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">timeout</text>
<rect x="378" y="50" width="314" height="232" rx="8" fill="#FFFFFF" stroke="#D9DFE4" stroke-width="1"/>
<text x="394" y="74" font-size="13" font-weight="600" fill="#17212B" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Response lost</text>
<rect x="406.0" y="88" width="84" height="24" rx="4" fill="#17212B"/>
<text x="448" y="104" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Client</text>
<line x1="448" y1="116" x2="448" y2="250" stroke="#D9DFE4" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="2 3"/>
<rect x="576.0" y="88" width="84" height="24" rx="4" fill="#17212B"/>
<text x="618" y="104" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Device</text>
<line x1="618" y1="116" x2="618" y2="250" stroke="#D9DFE4" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="2 3"/>
<line x1="448" y1="140" x2="611.0" y2="145.8" stroke="#B35A1F" stroke-width="1.6"/>
<polygon points="618,146 610.9,149.4 611.1,142.2" fill="#B35A1F"/>
<text x="533.0" y="138.0" font-size="10.5" font-weight="400" fill="#B35A1F" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">write 50 kW</text>
<rect x="612" y="152" width="12" height="26" rx="3" fill="#F6E3D6" stroke="#B35A1F" stroke-width="1"/>
<text x="630" y="170" font-size="10.5" font-weight="400" fill="#B35A1F" text-anchor="start" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">limit set</text>
<line x1="618" y1="188" x2="515.0" y2="193.6" stroke="#B83A26" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="504" y1="190" x2="512" y2="198" stroke="#B83A26" stroke-width="2" stroke-linecap="butt"/>
<line x1="504" y1="198" x2="512" y2="190" stroke="#B83A26" stroke-width="2" stroke-linecap="butt"/>
<text x="563.0" y="186.0" font-size="10.5" font-weight="400" fill="#B83A26" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">ok</text>
<rect x="414" y="214" width="68" height="22" rx="4" fill="#F6DDD8" stroke="#B83A26" stroke-width="1"/>
<text x="448" y="229" font-size="11" font-weight="600" fill="#B83A26" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">timeout</text>
<text x="28" y="306" font-size="11.5" font-weight="500" fill="#17212B" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Same observation, two different world states. Retry blindly only what is idempotent or correlated.</text></svg>
