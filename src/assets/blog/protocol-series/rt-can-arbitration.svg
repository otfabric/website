<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="CAN arbitration between three nodes that start sending at the same moment. Identifier bits are sent most significant first; a 0 is dominant and overwrites a 1 on the bus. Node A, identifier 0x123, sends a recessive 1 at the third bit while the others send 0, sees the bus differ and stops transmitting. Node C, 0x0F4, loses the same way at the ninth bit. Node B, 0x0F0, wins and its frame continues undamaged; A and C try again when the bus is idle."><rect width="720" height="300" fill="#F4F6F8"/><text x="28" y="32" font-size="15" font-weight="600" fill="#17212B" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">CAN arbitration: the lowest identifier wins, and nothing is destroyed</text>
<text x="199.0" y="66" font-size="9.5" font-weight="400" fill="#5A6875" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">ID10</text>
