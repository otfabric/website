<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Top: GOOSE. Before an event the publisher repeats its message at the maximum interval, for example once a second. When the state changes, stNum increases and the message is sent at once and repeated at growing intervals from the minimum time, 2, 4, 8 milliseconds and so on, back to the heartbeat; sqNum counts the repeats. Bottom: Sampled Values. A merging unit sends a frame every 250 microseconds, 4000 per second at 50 hertz with one sample per frame, with a sample counter, whether or not anything changed."><rect width="720" height="340" fill="#F4F6F8"/><text x="28" y="32" font-size="15" font-weight="600" fill="#17212B" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">GOOSE repeats state; Sampled Values stream samples</text>
<text x="28" y="62" font-size="12.5" font-weight="600" fill="#17212B" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">GOOSE · event-driven, then retransmitted</text>
