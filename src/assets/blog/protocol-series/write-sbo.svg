<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A select-before-operate control of a breaker. The control application sends SELECT and the device confirms the selection; that shows the command was delivered. The application sends OPERATE with the same parameters and the device accepts it. The device energizes the trip coil and the contacts move over tens of milliseconds. The auxiliary contact reports the new position to the device. IEC 61850 with enhanced security then sends CommandTermination, and an IEC 104 station may send ACTTERM, depending on the command type and the station: the device reports execution as far as it knows. Finally a position report shows the breaker open: independent verification. DNP3 has no termination message, so it goes straight from accepted to the position event."><rect width="720" height="470" fill="#F4F6F8"/><text x="28" y="32" font-size="15" font-weight="600" fill="#17212B" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Operating a breaker with select-before-operate</text>
<rect x="175.0" y="52" width="110" height="24" rx="4" fill="#17212B"/>
<text x="230" y="68" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Control app</text>
<line x1="230" y1="80" x2="230" y2="430" stroke="#D9DFE4" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="2 3"/>
<rect x="385.0" y="52" width="130" height="24" rx="4" fill="#17212B"/>
<text x="450" y="68" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Outstation / IED</text>
<line x1="450" y1="80" x2="450" y2="430" stroke="#D9DFE4" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="2 3"/>
<rect x="592.0" y="52" width="96" height="24" rx="4" fill="#17212B"/>
<text x="640" y="68" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Breaker</text>
<line x1="640" y1="80" x2="640" y2="430" stroke="#D9DFE4" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="2 3"/>
<line x1="230" y1="104" x2="443.0" y2="109.8" stroke="#B35A1F" stroke-width="1.6"/>
<polygon points="450,110 442.9,113.4 443.1,106.2" fill="#B35A1F"/>
<text x="340.0" y="102.0" font-size="10.5" font-weight="400" fill="#B35A1F" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">SELECT  open</text>
<line x1="450" y1="134" x2="237.0" y2="139.8" stroke="#B35A1F" stroke-width="1.6" stroke-dasharray="2 3"/>
<polygon points="230,140 236.9,136.2 237.1,143.4" fill="#B35A1F"/>
<text x="340.0" y="132.0" font-size="10.5" font-weight="400" fill="#B35A1F" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">selected</text>
<line x1="230" y1="176" x2="443.0" y2="181.8" stroke="#B35A1F" stroke-width="1.6"/>
<polygon points="450,182 442.9,185.4 443.1,178.2" fill="#B35A1F"/>
<text x="340.0" y="174.0" font-size="10.5" font-weight="400" fill="#B35A1F" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">OPERATE  open, same parameters</text>
<line x1="450" y1="206" x2="237.0" y2="211.8" stroke="#B35A1F" stroke-width="1.6" stroke-dasharray="2 3"/>
<polygon points="230,212 236.9,208.2 237.1,215.4" fill="#B35A1F"/>
<text x="340.0" y="204.0" font-size="10.5" font-weight="400" fill="#B35A1F" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">accepted</text>
<line x1="450" y1="236" x2="633.0" y2="241.8" stroke="#B35A1F" stroke-width="1.6"/>
<polygon points="640,242 632.9,245.4 633.1,238.2" fill="#B35A1F"/>
<text x="545.0" y="234.0" font-size="10.5" font-weight="400" fill="#B35A1F" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">trip coil</text>
<rect x="633" y="248" width="14" height="60" rx="3" fill="#F6E3D6" stroke="#B35A1F" stroke-width="1"/>
<text x="654" y="274" font-size="10.5" font-weight="400" fill="#5A6875" text-anchor="start" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">contacts</text>
<text x="654" y="288" font-size="10.5" font-weight="400" fill="#5A6875" text-anchor="start" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">move</text>
<line x1="640" y1="318" x2="457.0" y2="323.8" stroke="#0A7C80" stroke-width="1.6"/>
<polygon points="450,324 456.9,320.2 457.1,327.4" fill="#0A7C80"/>
<circle cx="640" cy="318" r="3" fill="#0A7C80"/>
<text x="545.0" y="316.0" font-size="10.5" font-weight="400" fill="#0A7C80" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">aux contact</text>
<line x1="450" y1="346" x2="237.0" y2="351.8" stroke="#B35A1F" stroke-width="1.6" stroke-dasharray="2 3"/>
<polygon points="230,352 236.9,348.2 237.1,355.4" fill="#B35A1F"/>
<text x="340.0" y="344.0" font-size="10.5" font-weight="400" fill="#B35A1F" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">termination, if sent</text>
<line x1="450" y1="404" x2="237.0" y2="409.8" stroke="#0A7C80" stroke-width="1.6"/>
<polygon points="230,410 236.9,406.2 237.1,413.4" fill="#0A7C80"/>
<circle cx="450" cy="404" r="3" fill="#0A7C80"/>
<text x="340.0" y="402.0" font-size="10.5" font-weight="400" fill="#0A7C80" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">position report: OPEN</text>
<text x="28" y="126" font-size="12" font-weight="600" fill="#17212B" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Delivered</text>
<line x1="100" y1="122" x2="222" y2="122" stroke="#D9DFE4" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 3"/>
<text x="28" y="198" font-size="12" font-weight="600" fill="#17212B" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Accepted</text>
<line x1="100" y1="194" x2="222" y2="194" stroke="#D9DFE4" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 3"/>
<text x="28" y="338" font-size="12" font-weight="600" fill="#17212B" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Executed</text>
<line x1="100" y1="334" x2="222" y2="334" stroke="#D9DFE4" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 3"/>
<text x="28" y="412" font-size="12" font-weight="600" fill="#0A7C80" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Verified</text>
<line x1="100" y1="408" x2="222" y2="408" stroke="#D9DFE4" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 3"/>
<text x="28" y="352" font-size="9.5" font-weight="400" fill="#5A6875" text-anchor="start" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">as reported</text>
<text x="28" y="426" font-size="9.5" font-weight="400" fill="#5A6875" text-anchor="start" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">by the process</text>
<text x="28" y="456" font-size="10.5" font-weight="400" fill="#5A6875" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">IEC 61850 enhanced security sends CommandTermination; IEC 104 ACTTERM depends on command and station; DNP3 has none.</text></svg>
