<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Three different acknowledgements of one alarm. The device sends an alarm notification to the gateway. First the transport acknowledges the bytes. Then the protocol confirms the notification, so the device may release it from its buffer. What that confirmation covers differs per protocol, and none of them proves that the gateway stored the alarm. The gateway shows the alarm to an operator. Minutes later the operator acknowledges it, the gateway sends an alarm acknowledgement to the device, and the device records it. Only the last one means a person has seen the alarm."><rect width="720" height="380" fill="#F4F6F8"/><text x="28" y="32" font-size="15" font-weight="600" fill="#17212B" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">One alarm, three acknowledgements</text>
<rect x="45.0" y="52" width="90" height="24" rx="4" fill="#17212B"/>
<text x="90" y="68" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Device</text>
<line x1="90" y1="80" x2="90" y2="360" stroke="#D9DFE4" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="2 3"/>
<rect x="245.0" y="52" width="90" height="24" rx="4" fill="#17212B"/>
<text x="290" y="68" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Gateway</text>
<line x1="290" y1="80" x2="290" y2="360" stroke="#D9DFE4" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="2 3"/>
<rect x="425.0" y="52" width="90" height="24" rx="4" fill="#17212B"/>
<text x="470" y="68" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Operator</text>
<line x1="470" y1="80" x2="470" y2="360" stroke="#D9DFE4" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="2 3"/>
<line x1="90" y1="104" x2="283.0" y2="109.8" stroke="#0A7C80" stroke-width="1.6"/>
<polygon points="290,110 282.9,113.4 283.1,106.2" fill="#0A7C80"/>
<circle cx="90" cy="104" r="3" fill="#0A7C80"/>
<text x="190.0" y="102.0" font-size="10.5" font-weight="400" fill="#0A7C80" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">alarm notification</text>
<line x1="290" y1="128" x2="97.0" y2="131.9" stroke="#17212B" stroke-width="1" stroke-dasharray="5 4"/>
<polygon points="90,132 96.9,128.3 97.1,135.5" fill="#17212B"/>
<text x="190.0" y="125.0" font-size="9.5" font-weight="400" fill="#17212B" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">transport ACK</text>
<line x1="290" y1="160" x2="97.0" y2="165.8" stroke="#17212B" stroke-width="1.6" stroke-dasharray="5 4"/>
<polygon points="90,166 96.9,162.2 97.1,169.4" fill="#17212B"/>
<text x="190.0" y="158.0" font-size="10.5" font-weight="400" fill="#17212B" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">protocol confirm</text>
<line x1="290" y1="200" x2="463.0" y2="205.8" stroke="#0A7C80" stroke-width="1.6"/>
<polygon points="470,206 462.9,209.4 463.1,202.2" fill="#0A7C80"/>
<circle cx="290" cy="200" r="3" fill="#0A7C80"/>
<text x="380.0" y="198.0" font-size="10.5" font-weight="400" fill="#0A7C80" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">alarm shown</text>
<text x="470" y="246" font-size="10.5" font-weight="400" fill="#5A6875" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">⋮  minutes later</text>
<line x1="470" y1="280" x2="297.0" y2="285.8" stroke="#17212B" stroke-width="1.6"/>
<polygon points="290,286 296.9,282.2 297.1,289.4" fill="#17212B"/>
<text x="380.0" y="278.0" font-size="10.5" font-weight="400" fill="#17212B" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">acknowledge</text>
<line x1="290" y1="304" x2="97.0" y2="309.8" stroke="#17212B" stroke-width="1.6"/>
<polygon points="90,310 96.9,306.2 97.1,313.4" fill="#17212B"/>
<text x="190.0" y="302.0" font-size="10.5" font-weight="400" fill="#17212B" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">acknowledge alarm</text>
<line x1="90" y1="330" x2="283.0" y2="335.8" stroke="#17212B" stroke-width="1.6" stroke-dasharray="5 4"/>
<polygon points="290,336 282.9,339.4 283.1,332.2" fill="#17212B"/>
<text x="190.0" y="328.0" font-size="10.5" font-weight="400" fill="#17212B" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">alarm acked</text>
<circle cx="552" cy="126" r="9" fill="#17212B"/>
<text x="552" y="130" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">1</text>
<text x="568" y="130" font-size="12.5" font-weight="600" fill="#17212B" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Transport</text>
<text x="568" y="145" font-size="10.5" font-weight="400" fill="#5A6875" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">the bytes arrived</text>
<circle cx="552" cy="162" r="9" fill="#17212B"/>
<text x="552" y="166" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">2</text>
<text x="568" y="166" font-size="12.5" font-weight="600" fill="#17212B" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Protocol</text>
<text x="568" y="181" font-size="10.5" font-weight="400" fill="#5A6875" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">the device may release it;</text>
<text x="568" y="194" font-size="10.5" font-weight="400" fill="#5A6875" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">scope differs per protocol;</text>
<text x="568" y="207" font-size="10.5" font-weight="400" fill="#5A6875" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">not proof it is stored</text>
<circle cx="552" cy="308" r="9" fill="#17212B"/>
<text x="552" y="312" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">3</text>
<text x="568" y="312" font-size="12.5" font-weight="600" fill="#17212B" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Operator</text>
<text x="568" y="327" font-size="10.5" font-weight="400" fill="#5A6875" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">a person or rule</text>
<text x="568" y="340" font-size="10.5" font-weight="400" fill="#5A6875" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">has seen the alarm</text></svg>
